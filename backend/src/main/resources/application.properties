spring.application.name=backend
# Use PORT env variable (set by Render) with fallback to 9090 for local dev
server.port=${PORT:9090}
server.forward-headers-strategy=framework
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=Lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
firebase.service-account-path=firebase/serviceAccountKey.json
firebase.web-api-key=${FIREBASE_WEB_API_KEY:}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080,http://127.0.0.1:8080}
app.admin.employee-id=${ADMIN_EMPLOYEE_ID:Admin323}
app.admin.password=${ADMIN_PASSWORD:Admin@srmap37}
app.admin.recovery-email=${ADMIN_RECOVERY_EMAIL:admin@srmtech.com}
